name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager --install 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Work around Android 37 SDK platform directory name
        run: |
          if [ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          fi
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug

      # PRs compile without access to signing secrets, and publish no APKs.
      - name: Restore signing key from repository secrets
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.SHELFG_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SHELFG_SIGNING_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Set SHELFG_KEYSTORE_BASE64 and SHELFG_SIGNING_PASSWORD in repository Actions secrets."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shelfg-signing-key.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/shelfg-signing-key.p12" \
            -storepass "$KEYSTORE_PASSWORD" -alias shelfg > /dev/null
      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          SHELFG_SIGNING_KEYSTORE: ${{ runner.temp }}/shelfg-signing-key.p12
          SHELFG_SIGNING_PASSWORD: ${{ secrets.SHELFG_SIGNING_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify APK signature
        if: github.event_name != 'pull_request'
        run: |
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk
      - name: Upload signed release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: shelfg-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
